{% extends "base.html" %}{% block content %}<div class="page narrow"><div class="eyebrow">WORKSPACE SETUP · 01</div><h1>Configure your auction</h1><p class="muted">Choose the sport, team count and auction purse. You can create 2–200 teams; team names can be edited later.</p><form method="post" class="panel form-grid"><label class="span-2">Tournament / auction name<input name="name" placeholder="e.g. City Premier League 2026" required></label><label>Sport<select name="sport"><option>Cricket</option><option>Football</option><option>Kabaddi</option><option>Basketball</option><option>Hockey</option><option>Volleyball</option><option>Custom sport</option></select></label><label>Number of teams<input type="number" name="team_count" min="2" max="200" value="8" required><small>Choose any number from 2 to 200.</small></label><label>Budget per team<input type="number" name="purse" min="1" value="10000000" required></label><label>Maximum squad size<input type="number" name="max_players" min="1" max="100" value="25" required></label><label>Minimum bid increment<input type="number" name="bid_increment" min="1" value="100000" required></label><div class="span-2"><button class="button button-primary">Create auction workspace →</button></div></form></div>{% endblock %}
